<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Placement Analytics{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><b>🎓 Placement Analytics</b>
<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('predict') }}">Predict</a><a href="{{ url_for('students') }}">Students</a></nav>
<main>{% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
